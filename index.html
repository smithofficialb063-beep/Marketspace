<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarketSpace - Buy, Sell & Earn</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f6f7f9;color:#111}
header{position:sticky;top:0;z-index:10;background:#111;color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff;text-decoration:none;font-weight:800;font-size:20px}
header a span{color:#facc15}
nav{display:flex;gap:8px;flex-wrap:wrap;padding:10px;background:#fff;border-bottom:1px solid #eee;position:sticky;top:52px;z-index:9}
nav a,nav button{padding:8px 12px;border-radius:999px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:14px;text-decoration:none;color:#111}
nav .active{background:#111;color:#fff}
.wrap{max-width:1100px;margin:0 auto;padding:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr 1fr 1fr}}
.card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #eee;display:flex;flex-direction:column}
.card img{width:100%;height:180px;object-fit:cover;background:#eee}
.card .b{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.price{font-weight:900;font-size:17px}
.old{text-decoration:line-through;color:#999;font-size:13px;font-weight:400}
.btn{background:#111;color:#fff;border:0;padding:11px 14px;border-radius:10px;cursor:pointer;font-weight:700;width:100%}
.btn.y{background:#facc15;color:#111}
.btn.g{background:#16a34a;color:#fff}
.btn.sm{padding:8px 10px;font-size:13px;width:auto}
.row{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:#fff;border-radius:14px;padding:14px;border:1px solid #eee}
.main{width:100%;max-height:420px;object-fit:cover;border-radius:12px;background:#eee}
.strip{display:flex;gap:8px;margin-top:8px;overflow:auto}
.strip img{width:72px;height:72px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent}
.strip img.sel{border-color:#111}
input,textarea,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin:6px 0;font-size:15px}
.note{font-size:13px;color:#666}
.badge{display:inline-block;background:#fef3c7;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}
.linkbox{background:#f8fafc;border:1px dashed #cbd5e1;padding:10px;border-radius:10px;word-break:break-all;font-size:13px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:999px;display:none;z-index:99;font-size:14px}
</style>
</head>
<body>
<header><a href="#market">Market<span>Space</span></a><div id="authArea"></div></header>
<nav id="nav"></nav>
<div class="wrap" id="app">Loading...</div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== KEEP YOUR OWN FIREBASE CONFIG HERE =====
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
// ===============================================
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const ADMIN_EMAIL = 'smithofficialb063@gmail.com';
const $ = s => document.querySelector(s);
const esc = s => String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){ const t=$('#toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',3000); }
function money(n){ return 'GH₵'+Number(n||0).toFixed(2); }
function downloadPic(url, name){
  try{
    const a=document.createElement('a');
    a.href=url; a.download=name||'marketspace-product.jpg'; a.target='_blank';
    document.body.appendChild(a); a.click(); a.remove();
    toast('Picture saved / opened - hold to save if it opens in a new tab');
  }catch(e){ window.open(url,'_blank'); }
}

let user=null, profile=null, products=[], myPromos=new Set();

auth.onAuthStateChanged(async u=>{
  user=u;
  if(u){
    try{ const d=await db.collection('users').doc(u.uid).get(); profile=d.exists?d.data():null; }catch(e){ profile=null; }
  } else profile=null;
  renderNav(); router();
});

function renderNav(){
  const isAdmin = user && user.email===ADMIN_EMAIL;
  $('#authArea').innerHTML = user ? `<span style="font-size:13px">${esc(user.email)}</span> <button onclick="logout()" style="margin-left:6px;padding:6px 10px;border-radius:999px;border:0;background:#facc15;font-weight:700;cursor:pointer">Logout</button>` : `<a href="#login" style="font-size:14px">Login</a>`;
  $('#nav').innerHTML = `
    <a href="#market" data-nav>Marketplace</a>
    <a href="#dashboard" data-nav>Dashboard</a>
    <a href="#sell" data-nav>Sell Product</a>
    ${isAdmin?`<a href="#admin" data-nav>Admin</a>`:''}
    ${user?`<span class="badge">Code: ${esc(profile?.code||'—')}</span>`:''}
  `;
}
async function logout(){ await auth.signOut(); location.hash='#market'; }

async function loadProducts(){
  const snap = await db.collection('products').orderBy('createdAt','desc').limit(100).get();
  products = snap.docs.map(d=>({id:d.id, ...d.data()}));
  if(user){
    const ps = await db.collection('codes').where('uid','==',user.uid).get().catch(()=>null);
    // promos are tracked via profiles/codes - keep simple: check localStorage
    try{ myPromos = new Set(JSON.parse(localStorage.getItem('myPromos_'+user.uid)||'[]')); }catch(e){ myPromos=new Set(); }
  }
}

function cardHTML(p){
  const im = Array.isArray(p.images)?p.images:(p.image?[p.image]:[]);
  const first = im[0]||'https://via.placeholder.com/400x300?text=No+Image';
  const isPromoting = myPromos.has(p.id);
  const comm = p.commission ? `<span class="badge">Earn ${p.commission}%</span>` : '';
  return `<div class="card">
    <img src="${first}" onclick="location.hash='#product/${p.id}'" style="cursor:pointer">
    <div class="b">
      <div style="font-weight:700;line-height:1.2">${esc(p.name)}</div>
      <div class="note" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.description||'')}</div>
      <div><span class="price">${money(p.price)}</span> ${p.oldPrice?`<span class="old">${money(p.oldPrice)}</span>`:''} ${comm}</div>
      <button class="btn" onclick="location.hash='#product/${p.id}'">View product</button>
      ${user?`<button class="btn y" onclick="quickPromote('${p.id}')">⚡ ${isPromoting?'Copy My Link':'Promote'}</button>
      <button class="btn g sm" onclick="quickSave('${p.id}')">⬇ Save Pictures</button>`:''}
    </div>
  </div>`;
}

async function quickSave(pid){
  const p = products.find(x=>x.id===pid); if(!p) return;
  const im = Array.isArray(p.images)?p.images:(p.image?[p.image]:[]);
  if(!im.length) return toast('No pictures for this product');
  im.forEach((u,i)=>setTimeout(()=>downloadPic(u,'marketspace-'+(i+1)+'.jpg'), i*600));
}
async function quickPromote(pid){
  if(!user) return location.hash='#login';
  const p = products.find(x=>x.id===pid); if(!p) return;
  const code = profile?.code || 'AF-'+user.uid.slice(0,6).toUpperCase();
  const link = location.origin + location.pathname + '#product/' + pid + '/' + code;
  myPromos.add(pid);
  try{ localStorage.setItem('myPromos_'+user.uid, JSON.stringify([...myPromos])); }catch(e){}
  try{ await navigator.clipboard.writeText(link); toast('Link copied! Now save pictures & share'); }
  catch(e){ prompt('Copy your affiliate link:', link); }
  router();
}

async function router(){
  const h = location.hash.replace('#','')||'market';
  const app = $('#app');
  document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active', a.getAttribute('href')==='#'+h.split('/')[0]));
  if(h.startsWith('product/')) return vProduct(h.split('/')[1], h.split('/')[2]);
  if(h==='market') return vMarket();
  if(h==='dashboard') return vDashboard();
  if(h==='sell') return vSell();
  if(h==='admin') return vAdmin();
  if(h==='login') return vLogin();
  return vMarket();
}

async function vMarket(){
  const app=$('#app');
  app.innerHTML='<p>Loading products...</p>';
  await loadProducts();
  app.innerHTML = `<h2 style="margin:4px 0 12px">Marketplace</h2>
  <div class="grid">${products.map(cardHTML).join('')||'<p>No products yet. Be the first to sell!</p>'}</div>`;
}

async function vProduct(id, affCode){
  const app=$('#app'); app.innerHTML='<p>Loading...</p>';
  if(!products.length) await loadProducts();
  let p = products.find(x=>x.id===id);
  if(!p){ try{ const d=await db.collection('products').doc(id).get(); if(d.exists) p={id:d.id,...d.data()}; }catch(e){} }
  if(!p){ app.innerHTML='<p>Product not found. <a href="#market">Back</a></p>'; return; }
  const im = Array.isArray(p.images)?p.images:(p.image?[p.image]:[]);
  // track click / lead if affiliate code present
  if(affCode && affCode!=='undefined'){
    db.collection('leads').add({productId:id, affCode, createdAt:firebase.firestore.FieldValue.serverTimestamp(), ua:navigator.userAgent}).catch(()=>{});
  }
  const isPromoting = myPromos.has(id);
  const code = profile?.code || (user?'AF-'+user.uid.slice(0,6).toUpperCase():null);
  const myLink = code ? location.origin + location.pathname + '#product/' + id + '/' + code : '';
  const commissionAmt = p.commission ? (Number(p.price)*Number(p.commission)/100).toFixed(2) : '0.00';

  app.innerHTML = `<div><a class="note" href="#market">&larr; All products</a><div class="panel" style="margin-top:8px">
  ${im.length?`<img class="main" id="mainpic" src="${im[0]}" alt="${esc(p.name)}">
  <div class="row" style="margin:10px 0">
    <button class="btn sm" data-act="saveall">⬇ Save All Pictures (${im.length})</button>
    <button class="btn g sm" data-act="saveone">⬇ Save This Picture</button>
  </div>
  <p class="note">Tip for affiliates: Tap Save, then use the pictures for your WhatsApp Status / TikTok promotion. On iPhone, if it opens in a new tab, hold the picture &gt; Save to Photos.</p>
  ${im.length>1?`<div class="strip">${im.map((x,i)=>`<img src="${x}" data-act="pic" class="${i===0?'sel':''}" alt="">`).join('')}</div>`:''}`:''}
  <h2 style="margin:12px 0 4px">${esc(p.name)}</h2>
  <div><span class="price" style="font-size:22px">${money(p.price)}</span> ${p.oldPrice?`<span class="old">${money(p.oldPrice)}</span>`:''}</div>
  ${p.commission?`<div style="margin:8px 0"><span class="badge">Affiliate Earns ${p.commission}% = GH₵${commissionAmt} per sale</span></div>`:''}
  <p>${esc(p.description||'')}</p>
  ${affCode?`<p class="note">You came via affiliate code: <b>${esc(affCode)}</b></p>`:''}
  <div class="panel" style="background:#fffbeb;border-color:#fde68a;margin-top:12px">
    <b>For Affiliates — Promote This Product</b>
    ${!user?`<p class="note">Login to get your personal affiliate link.</p><button class="btn y" onclick="location.hash='#login'">Login to Promote</button>`
    : isPromoting ? `<p class="note">You are promoting this product. Your personal link:</p><div class="linkbox">${myLink}</div><div class="row" style="margin-top:8px"><button class="btn" data-t="${myLink}" data-act="copy">Copy My Link</button><button class="btn g" onclick="window.open('https://wa.me/?text='+encodeURIComponent('Check this out! '+myLink),'_blank')">Share on WhatsApp</button></div>`
    : `<p class="note">Tap Promote to get your personal link. You earn ${p.commission||0}% on every sale from your link.</p><button class="btn y" data-act="promote" data-id="${p.id}">Promote This Product</button>`}
  </div>
  <div style="margin-top:14px"><button class="btn" onclick="location.hash='#market'">Back to Marketplace</button></div>
  </div></div>`;
  // store current product for save handlers
  window._curProduct = p;
}

async function vDashboard(){
  if(!user) return location.hash='#login';
  const app=$('#app');
  app.innerHTML=`<h2>Dashboard</h2><div class="panel"><p><b>${esc(user.email)}</b></p><p>Your Code: <b>${esc(profile?.code||'—')}</b></p><p>Membership: <b>${esc(profile?.membership||'Free')}</b> | Paid Until: ${esc(profile?.paidUntil||'—')}</p><p class="note">Products you are promoting: ${myPromos.size}</p></div><div style="margin-top:12px"><h3>Products I am marketing</h3><div class="grid">${products.filter(p=>myPromos.has(p.id)).map(cardHTML).join('')||'<p>You have not promoted any product yet. Go to Marketplace &gt; Promote.</p>'}</div></div>`;
  if(!products.length) await loadProducts();
  router(); // re-render after load if needed
}

async function vSell(){
  if(!user) return location.hash='#login';
  $('#app').innerHTML=`<h2>Sell a Product</h2><div class="panel"><input id="pName" placeholder="Product name"><textarea id="pDesc" placeholder="Description"></textarea><input id="pPrice" type="number" placeholder="Price GH₵"><input id="pOld" type="number" placeholder="Old price (optional)"><input id="pComm" type="number" placeholder="Affiliate commission % e.g. 10"><input id="pPics" type="file" accept="image/*" multiple><p class="note">You can upload multiple pictures. They will be saved for affiliates to download.</p><button class="btn" onclick="doSell()">Publish Product</button></div>`;
}
async function doSell(){
  const name=$('#pName').value.trim(), desc=$('#pDesc').value.trim(), price=Number($('#pPrice').value), oldPrice=Number($('#pOld').value)||null, commission=Number($('#pComm').value)||0;
  if(!name||!price) return toast('Add name and price');
  const files=[...$('#pPics').files];
  const images=[];
  for(const f of files){ images.push(await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(f); })); }
  await db.collection('products').add({name, description:desc, price, oldPrice, commission, images, sellerUid:user.uid, sellerEmail:user.email, createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  toast('Product published!'); location.hash='#market';
}

async function vLogin(){
  $('#app').innerHTML=`<h2>Login / Sign Up</h2><div class="panel"><input id="em" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button class="btn" onclick="doLogin()">Login / Create Account</button><p class="note">If you don't have an account, we will create one for you.</p></div>`;
}
async function doLogin(){
  const em=$('#em').value.trim(), pw=$('#pw').value;
  try{ await auth.signInWithEmailAndPassword(em,pw); }
  catch(e){ try{ const cr=await auth.createUserWithEmailAndPassword(em,pw); const code='AF-'+cr.user.uid.slice(0,6).toUpperCase(); await db.collection('users').doc(cr.user.uid).set({email:em, code, membership:'Free', createdAt:firebase.firestore.FieldValue.serverTimestamp()}); await db.collection('profiles').doc(code).set({email:em, uid:cr.user.uid, code, membership:'Free', createdAt:firebase.firestore.FieldValue.serverTimestamp()}); }catch(e2){ toast(e2.message); return; } }
  location.hash='#market';
}

async function vAdmin(){
  if(!user || user.email!==ADMIN_EMAIL) return $('#app').innerHTML='<p>Admin only.</p>';
  const app=$('#app'); app.innerHTML='<p>Loading admin...</p>';
  const snap=await db.collection('payments').orderBy('createdAt','desc').limit(50).get().catch(()=>null);
  const pays=snap?snap.docs.map(d=>({id:d.id,...d.data()})):[];
  app.innerHTML=`<h2>Admin - Membership Payments</h2>${pays.map(p=>`<div class="panel" style="margin-bottom:8px"><b>${esc(p.email||p.uid||'')}</b> - ${esc(p.plan||'')} - GH₵${esc(p.amount||'')} - <b>${esc(p.status||'pending')}</b><div class="row" style="margin-top:8px"><button class="btn g sm" data-act="approve" data-id="${p.id}">Approve</button><button class="btn sm" data-act="reject" data-id="${p.id}">Reject</button></div></div>`).join('')||'<p>No payments yet.</p>'}`;
}

document.addEventListener('click', async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;
  if(a==='pic'){ const m=$('#mainpic'); if(m){ m.src=b.src; document.querySelectorAll('.strip img').forEach(i=>i.classList.remove('sel')); b.classList.add('sel'); } return; }
  if(a==='copy'){ try{ await navigator.clipboard.writeText(b.dataset.t); toast('Copied'); }catch(x){ toast('Press and hold to copy'); } return; }
  if(a==='saveone'){ const src=$('#mainpic')?.src; if(src) downloadPic(src,'marketspace-product.jpg'); return; }
  if(a==='saveall'){ const pics=[...document.querySelectorAll('.strip img')].map(i=>i.src); const main=$('#mainpic')?.src; const all=main?[main,...pics]:pics; if(!all.length) return; all.forEach((u,i)=>setTimeout(()=>downloadPic(u,'marketspace-'+(i+1)+'.jpg'), i*600)); return; }
  if(a==='promote'){ if(!user) return location.hash='#login'; const pid=b.dataset.id; const code=profile?.code||'AF-'+user.uid.slice(0,6).toUpperCase(); myPromos.add(pid); try{ localStorage.setItem('myPromos_'+user.uid, JSON.stringify([...myPromos])); }catch(e){} toast('You are now promoting this product!'); vProduct(pid); return; }
  if(a==='approve'||a==='reject'){ return more(a,b,b.dataset.id); }
});

async function more(a,b,id){
  // Admin approve / reject membership payment
  if(a==='approve' || a==='reject'){
    try{
      const doc=await db.collection('payments').doc(id).get();
      if(!doc.exists) return toast('Payment not found');
      const pay=doc.data();
      const status = a==='approve'?'approved':'rejected';
      const batch=db.batch();
      batch.update(db.collection('payments').doc(id),{status, approvedAt:firebase.firestore.FieldValue.serverTimestamp()});
      if(a==='approve' && pay.uid){
        const paidUntil = new Date(); paidUntil.setDate(paidUntil.getDate()+30);
        const paidStr = paidUntil.toISOString().slice(0,10);
        batch.set(db.collection('users').doc(pay.uid),{membership:pay.plan||'Pro', paidUntil:paidStr},{merge:true});
        if(pay.code) batch.set(db.collection('profiles').doc(pay.code),{membership:pay.plan||'Pro', paidUntil:paidStr},{merge:true});
      }
      await batch.commit();
      toast(a==='approve'?'Approved':'Rejected');
      vAdmin();
    }catch(err){
      console.error(err);
      if(err.code==='permission-denied') toast('Not allowed. Check Firestore Rules & login as admin.');
      else toast(err.message||'Failed');
    }
    return true;
  }
}
window.addEventListener('hashchange', router);
</script>
</body>
</html>
