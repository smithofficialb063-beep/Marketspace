<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="description" content="Marketspace: sellers list products, affiliates promote them and earn commission.">
<title>Marketspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{
  --bg:#0A0A0A; --surface:#141414; --surface2:#1E1E1E; --line:#2E2E2E; --fg:#F5F5F0; --muted:#A9A9A0;
  --y:#FFD400; --on-y:#0A0A0A; --danger:#FF7A70;
  --font-d:'Space Grotesk',system-ui,sans-serif; --font-b:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--font-d);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,7vw,52px);font-weight:700;letter-spacing:-.02em}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
a{color:inherit}
.wrap{max-width:1000px;margin:0 auto}
.note{font-size:13px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:16px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-d);font-weight:700;font-size:22px;text-decoration:none;display:flex;align-items:center;gap:8px}
.brand i{width:24px;height:24px;background:var(--y);border-radius:6px;display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;left:6px;top:6px;width:12px;height:12px;border:3px solid var(--on-y);border-radius:50%}
nav{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:0}
nav a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500}
nav a[aria-current="page"]{background:var(--surface2);color:var(--y)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--y);color:var(--on-y);font-size:12px;font-weight:700;text-align:center;line-height:20px}
.acct{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
@media (max-width:700px){nav{order:3;flex:1 1 100%}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--y);background:var(--y);color:var(--on-y);
  font:600 14px var(--font-b);padding:10px 16px;border-radius:8px;cursor:pointer;text-decoration:none;min-height:40px}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--y);color:var(--y)}
.btn.small{padding:6px 12px;min-height:34px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}

.hero{padding-block:36px 24px;display:grid;gap:16px}
.eyebrow{color:var(--y);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.lead{max-width:56ch;color:var(--muted);font-size:17px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-block:8px 32px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.head2{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card,.panel,.item,.stat,.sub,.nitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card{display:flex;flex-direction:column;gap:10px}
.card .btn{margin-top:auto;align-self:flex-start}
.price{font-family:var(--font-d);font-size:22px;font-weight:700}
.earn b{color:var(--y)}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line);color:var(--muted);text-decoration:none}
.chip.y{background:var(--y);color:var(--on-y);border-color:var(--y)}
.chip.bad{color:var(--danger);border-color:var(--danger)}
a.chip:hover{border-color:var(--y);color:var(--y)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}

.thumb{width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:var(--surface2);display:block}
.ph{display:grid;place-items:center;font-family:var(--font-d);font-size:44px;color:var(--y)}
.gal{display:grid;gap:10px}
.gal .main{aspect-ratio:4/3;width:100%;object-fit:contain;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.strip{display:flex;flex-wrap:wrap;gap:8px}
.strip button{padding:0;border:2px solid var(--line);border-radius:8px;background:none;cursor:pointer;width:64px;height:64px;overflow:hidden}
.strip button:hover{border-color:var(--y)}
.strip img{width:100%;height:100%;object-fit:cover;display:block}
.pics{display:flex;flex-wrap:wrap;gap:10px}
.pic{position:relative;width:84px;height:84px}
.pic img{width:100%;height:100%;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.pic .x{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:0;background:var(--y);color:var(--on-y);font-weight:700;cursor:pointer;line-height:1}
.mini{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:none}
.mini.ph{font-size:24px}

input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:42px;width:100%}
textarea{min-height:84px;resize:vertical}
input[type=search]{max-width:300px}
input[type=file]{padding:8px}
label{display:grid;gap:6px;font-weight:500;font-size:14px}
.form{display:grid;gap:14px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.panel{display:grid;gap:14px}
.panel.narrow{max-width:600px;margin-inline:auto}
.err{color:var(--danger);font-size:14px}
.code{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.code strong{font-family:var(--font-d);font-size:20px;letter-spacing:.04em;color:var(--y)}
.pg{padding-block:28px}
.pg>h2{margin-bottom:6px}

.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-block:16px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tabs a{padding:8px 14px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:600;border:1px solid var(--line)}
.tabs a[aria-current="page"]{background:var(--y);color:var(--on-y);border-color:var(--y)}
.tabs a[aria-current="page"] .badge{background:var(--on-y);color:var(--y)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-block:16px}
.stat small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.stat strong{font-family:var(--font-d);font-size:24px;display:block;margin-top:2px}
.stat.y{background:var(--y);color:var(--on-y);border-color:var(--y)}
.stat.y small{color:var(--on-y)}
.sub{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.sub.active{border-color:var(--y)}
.sub.expired,.sub.unpaid{border-color:var(--danger)}
.list{display:grid;gap:12px;margin-top:12px}
.item{display:grid;gap:12px}
.itemtop{display:flex;gap:12px;align-items:flex-start;min-width:0}
.itemtop>div{min-width:0;flex:1}
.linkrow{display:flex;gap:8px;align-items:center;min-width:0}
.linkrow code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.inline{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:12px}
.locked{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;background:var(--surface2);border:1px solid var(--y);border-radius:12px;padding:16px}
.locked small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.locked strong{font-family:var(--font-d);font-size:22px;display:block}
.locked .big{color:var(--y);font-size:28px;letter-spacing:.03em}
.contact{display:grid;gap:10px;border:1px solid var(--y);border-radius:12px;padding:14px;background:var(--surface2)}
.contact strong{font-family:var(--font-d);font-size:20px;color:var(--y)}
ol.steps{margin:0;padding-left:20px;display:grid;gap:6px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.nitem{display:grid;gap:10px}
.nitem.unread{border-color:var(--y)}
.nitem .head2 p{flex:1;min-width:200px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:grid;place-items:center;padding:16px;z-index:20;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--y);border-radius:14px;padding:22px;max-width:460px;width:100%;display:grid;gap:14px}
.choice{display:grid;gap:4px;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg)}
.choice:hover{border-color:var(--y)}
.choice b{font-family:var(--font-d);font-size:18px;color:var(--y)}
.choice span{color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--y);color:var(--on-y);font-weight:600;padding:10px 16px;border-radius:8px;max-width:calc(100% - 32px);z-index:30}
[hidden]{display:none!important}
footer.foot{border-top:1px solid var(--line);margin-top:40px;padding-top:20px;display:grid;gap:6px;text-align:center}
.wa{color:var(--y);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#market"><i></i>Marketspace</a>
    <nav id="nav" aria-label="Main"></nav>
    <div class="acct" id="acct"></div>
  </header>
  <main id="app"></main>
  <footer class="foot" id="foot"></footer>
</div>
<div id="toast" class="toast" hidden role="status"></div>
<noscript>Marketspace needs JavaScript turned on.</noscript>

<script>
(function(){
'use strict';

/* ============ SETTINGS (edit here, then deploy again) ============ */
var CONFIG=Object.freeze({
  siteName:'Marketspace',
  momoNumber:'0257218681',          /* members pay the monthly fee to this number */
  momoName:'Eric Annor Gyau',
  fee:5,                            /* monthly fee in GH cedis */
  commissionMomoNumber:'0257411489',/* sellers pay affiliate commission to this number */
  commissionMomoName:'Eric Annor Gyau',
  currency:'GH₵',
  periodDays:30,                    /* one paid month */
  whatsappDisplay:'0257218681',
  whatsappIntl:'233257218681',      /* number in international format, no plus sign */
  minAge:18,
  minPictures:2,
  maxPictures:5,
  adminPin:'change-this-pin',       /* CHANGE THIS before deploying */
  googleClientId:''                 /* paste your Google OAuth Web Client ID to switch on "Continue with Google" */
});

/* ============ HELPERS ============ */
var DAY=864e5;
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return CONFIG.currency+' '+Number(n).toLocaleString('en-GH',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmt(t){return new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
function fmtT(t){return new Date(t).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function plural(n,w){return n+' '+w+(n===1?'':'s')}
function r2(n){return Math.round(n*100)/100}
function span(from){
  var a=new Date(from),b=new Date();
  var y=b.getFullYear()-a.getFullYear(),m=b.getMonth()-a.getMonth(),d=b.getDate()-a.getDate();
  if(d<0){m--;d+=new Date(b.getFullYear(),b.getMonth(),0).getDate()}
  if(m<0){y--;m+=12}
  return {y:Math.max(0,y),m:Math.max(0,m),d:Math.max(0,d)};
}
function since(from){var s=span(from);return plural(s.y,'year')+', '+plural(s.m,'month')+', '+plural(s.d,'day')}
var AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function rnd(n){
  var a=new Uint32Array(n),i,s='';
  if(window.crypto&&window.crypto.getRandomValues){window.crypto.getRandomValues(a)}else{for(i=0;i<n;i++)a[i]=Math.floor(Math.random()*4294967296)}
  for(i=0;i<n;i++)s+=AL.charAt(a[i]%AL.length);
  return s;
}
function hash(s){
  s='ms:'+s;var h1=0xdeadbeef,h2=0x41c6ce57,i,ch;
  for(i=0;i<s.length;i++){ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}
function toIntl(n){var d=String(n).replace(/\D/g,'');return d.charAt(0)==='0'?'233'+d.slice(1):d}
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},3200)}

/* ============ STORAGE ============ */
/* Data is kept in this browser (localStorage). A live site used by many people needs a shared database; every read and write goes through load() and save(). */
var KEY='marketspace_db_v1',SKEY='marketspace_session_v1',VKEY='marketspace_visitor_v1';
function blank(){return {users:{},products:{},picks:{},leads:[],notes:[],withdrawals:[],leadKeys:{},seq:1}}
function load(){try{var r=localStorage.getItem(KEY);if(r){return Object.assign(blank(),JSON.parse(r))}}catch(e){}return blank()}
var db=load();
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db));return true}
  catch(e){toast('Could not save. Storage is full. Remove a product or use smaller pictures.');return false}
}
var meCode=null;try{meCode=localStorage.getItem(SKEY)}catch(e){}
function me(){return meCode&&db.users[meCode]||null}
function setMe(c){meCode=c;try{if(c)localStorage.setItem(SKEY,c);else localStorage.removeItem(SKEY)}catch(e){}}
var vidMem=null;
function vid(){
  try{var v=localStorage.getItem(VKEY);if(!v){v=rnd(14);localStorage.setItem(VKEY,v)}return v}catch(e){}
  if(!vidMem)vidMem=rnd(14);return vidMem;
}
function newCode(role){var p=role==='seller'?'SEL-':'AF-',c;do{c=p+rnd(6)}while(db.users[c]);return c}
function allProducts(){return Object.keys(db.products).map(function(k){return db.products[k]})}
function usersArr(){return Object.keys(db.users).map(function(k){return db.users[k]})}
function pending(u){return (u.payments||[]).some(function(p){return p.status==='pending'})}
function status(u){if(!u)return 'none';if(u.paidUntil>Date.now())return 'active';if(pending(u))return 'pending';return u.paidUntil>0?'expired':'unpaid'}
function isActive(u){return status(u)==='active'}
function daysLeft(u){return Math.max(0,Math.ceil((u.paidUntil-Date.now())/DAY))}
function perSale(p){return r2(p.price*p.rate/100)}
function listed(){return allProducts().filter(function(p){var s=db.users[p.seller];return s&&isActive(s)})}
function promoLink(pid,code){return location.href.split('#')[0]+'#product/'+pid+'/'+code}
function leadById(id){return db.leads.filter(function(l){return l.id===id})[0]}
function txnUsed(tx){
  return usersArr().some(function(u){return (u.payments||[]).some(function(p){return p.txn===tx})})||db.leads.some(function(l){return l.payment&&l.payment.txn===tx});
}
function counted(l){return l.status==='owed'||l.status==='submitted'||l.status==='paid'}
function bal(code){
  var earned=0,pend=0,conf=0,out=0,done=0;
  db.leads.forEach(function(l){
    if(l.affiliate!==code)return;
    if(!counted(l))return;
    earned+=l.commission;
    if(l.status==='paid')conf+=l.commission;else pend+=l.commission;
  });
  db.withdrawals.forEach(function(w){
    if(w.affiliate!==code)return;
    out+=w.amount;if(w.status==='done')done+=w.amount;
  });
  return {earned:r2(earned),pending:r2(pend),available:r2(conf-out),paidOut:r2(done)};
}
function notify(to,type,text,extra){
  db.notes.push(Object.assign({id:db.seq++,to:to,type:type,text:text,at:Date.now(),read:false},extra||{}));
}
function unread(who){return db.notes.filter(function(n){return n.to===who&&!n.read}).length}
function ui0(){return {edit:null,del:null,payLead:null,reg:{},google:null,admin:false,q:'',confirmReset:false,imgs:[],eimgs:[]}}
var ui=ui0();

/* ============ SMALL VIEWS ============ */
function chip(t,c){return '<span class="chip '+(c||'')+'">'+esc(t)+'</span>'}
function badge(n){return n?'<span class="badge">'+n+'</span>':''}
function notice(t,body,btn){return '<div class="pg"><div class="panel narrow"><h2>'+esc(t)+'</h2><p class="note">'+body+'</p>'+(btn||'')+'</div></div>'}
function copyBtn(t,label){return '<button class="btn small" type="button" data-act="copy" data-t="'+esc(t)+'">'+(label||'Copy')+'</button>'}
function tabsHtml(list,cur,base){
  return '<div class="tabs">'+list.map(function(t,i){
    return '<a href="#'+base+(i===0?'':'/'+t[0])+'"'+(cur===t[0]?' aria-current="page"':'')+'>'+t[1]+'</a>';
  }).join('')+'</div>';
}
function thumbHtml(p,cls){
  var src=p.images&&p.images[0];
  return src?'<img class="'+(cls||'thumb')+'" src="'+src+'" alt="'+esc(p.name)+'">':'<div class="'+(cls||'thumb')+' ph">'+esc((p.name||'?').charAt(0).toUpperCase())+'</div>';
}
function subCard(u){
  var s=status(u),lbl={active:'Active',pending:'Payment pending',expired:'Expired',unpaid:'Not paid yet'}[s],line;
  if(s==='active')line=daysLeft(u)+' day'+(daysLeft(u)===1?'':'s')+' left. Paid until '+fmt(u.paidUntil)+'.';
  else if(s==='pending')line='Your payment is being checked. Your account opens as soon as it is confirmed.';
  else if(s==='expired')line='Your monthly fee ran out on '+fmt(u.paidUntil)+'. You cannot '+(u.role==='seller'?'list products':'promote products')+' until you pay again.';
  else line='Pay '+money(CONFIG.fee)+' to start '+(u.role==='seller'?'listing products':'promoting products')+'.';
  return '<div class="sub '+s+'"><div><div class="row"><h3>Membership</h3>'+chip(lbl,s==='active'?'y':(s==='pending'?'':'bad'))+'</div><p class="note" style="margin-top:6px">'+esc(line)+'</p></div>'+
    '<a class="btn small" href="#pay">'+(s==='active'?'Renew early':(s==='pending'?'View payment':'Pay '+money(CONFIG.fee)))+'</a></div>';
}
function card(p){
  var s=db.users[p.seller];
  return '<article class="card"><a href="#product/'+p.id+'">'+thumbHtml(p)+'</a><div>'+chip(p.rate+'% commission','y')+'</div><h3><a href="#product/'+p.id+'" style="text-decoration:none">'+esc(p.name)+'</a></h3>'+
    '<p class="note">by <a href="#u/'+esc(p.seller)+'">'+esc(s?s.name:p.seller)+'</a></p><div class="price num">'+money(p.price)+'</div>'+
    '<p class="note earn">Affiliates earn <b class="num">'+money(perSale(p))+'</b> per sale</p><a class="btn small" href="#product/'+p.id+'">View product</a></article>';
}
function gridHtml(q){
  q=(q||'').toLowerCase().trim();
  var l=listed().filter(function(p){return !q||(p.name+' '+(p.desc||'')).toLowerCase().indexOf(q)>-1}).sort(function(a,b){return b.createdAt-a.createdAt});
  if(!l.length)return '<div class="empty"><p>'+(q?'No products match your search.':'No products yet. Products from sellers who have paid their monthly fee appear here.')+'</p>'+(q||me()?'':'<a class="btn" href="#register/seller">Become a seller</a>')+'</div>';
  return l.map(card).join('');
}

/* ============ PICTURES ============ */
function thumbsHtml(list,k){
  return '<div class="pics">'+list.map(function(s,i){
    return '<div class="pic"><img src="'+s+'" alt="Picture '+(i+1)+'"><button type="button" class="x" data-act="rmimg" data-k="'+k+'" data-i="'+i+'" aria-label="Remove picture '+(i+1)+'">&times;</button></div>';
  }).join('')+'</div><p class="note">'+list.length+' of '+CONFIG.maxPictures+' pictures added. At least '+CONFIG.minPictures+' are needed.</p>';
}
function drawThumbs(k){var el=$('#thumbs-'+k);if(el)el.innerHTML=thumbsHtml(k==='a'?ui.imgs:ui.eimgs,k)}
function readImages(files,list,done){
  var arr=Array.prototype.slice.call(files).filter(function(f){return /^image\//.test(f.type)}),room=CONFIG.maxPictures-list.length;
  if(arr.length>room){toast('You can add up to '+CONFIG.maxPictures+' pictures.')}
  arr=arr.slice(0,Math.max(0,room));
  var left=arr.length;
  if(!left){done();return}
  function fin(){left--;if(left===0)done()}
  arr.forEach(function(f){
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var sc=Math.min(1,800/Math.max(img.width,img.height)),c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        list.push(c.toDataURL('image/jpeg',0.72));fin();
      };
      img.onerror=fin;img.src=fr.result;
    };
    fr.onerror=fin;fr.readAsDataURL(f);
  });
}

function trackVisit(p,ref){
  var m=me();
  if(ui.admin)return;
  if(m){
    if(m.role==='affiliate'&&isActive(m)){p.visitors=p.visitors||{};p.visitors[m.code]=(p.visitors[m.code]||0)+1;save()}
    return;
  }
  /* A buyer (not signed in) opened the product from an affiliate link */
  if(!ref)return;
  var a=db.users[ref];
  if(!a||a.role!=='affiliate'||!isActive(a))return;
  if((db.picks[ref]||[]).indexOf(p.id)<0)return;
  var key=vid()+'|'+p.id+'|'+ref;
  if(db.leadKeys[key])return;
  db.leadKeys[key]=Date.now();
  var c=perSale(p);
  var l={id:db.seq++,productId:p.id,productName:p.name,seller:p.seller,affiliate:ref,commission:c,at:Date.now(),status:'reached'};
  db.leads.push(l);
  notify(p.seller,'reach','The advertisement of affiliate '+ref+' for "'+p.name+'" has reached a buyer. When this buyer buys, tap Confirm sale. The affiliate then earns '+money(c)+'.',{leadId:l.id});
  notify(ref,'earn','A buyer opened your link for "'+p.name+'". You earn '+money(c)+' once the seller confirms the sale.',{leadId:l.id});
  save();
}

  var gal=imgs.length?'<div class="gal"><img class="main" id="mainpic" src="'+imgs[0]+'" alt="'+esc(p.name)+'">'+(imgs.length>1?'<div class="strip">'+imgs.map(function(x,i){return '<button type="button" data-act="pic" data-id="'+p.id+'" data-i="'+i+'" aria-label="Show picture '+(i+1)+'"><img src="'+x+'" alt=""></button>'}).join('')+'</div>':'')+'</div>':'';

    '<div class="row">'+chip(p.rate+'% commission','y')+'</div><h1 style="font-size:clamp(26px,5vw,38px)">'+esc(p.name)+'</h1>'+
    '<div class="price num">'+money(p.price)+'</div>'+

function leadAction(l){
  if(l.status==='reached')return '<div class="row"><button class="btn small" data-act="confirmsale" data-id="'+l.id+'">Confirm sale</button><button class="btn ghost small" data-act="nosale" data-id="'+l.id+'">No sale</button></div>';
  if(l.status==='declined')return '<div class="row">'+chip('Marked as no sale')+'</div>';
  if(l.status==='owed')return '<div class="row"><button class="btn small" data-act="paylead" data-id="'+l.id+'">Pay affiliate</button>'+(l.rejected?chip('Last payment was not confirmed. Check the transaction ID.','bad'):'')+'</div>'+(ui.payLead===l.id?payForm(l):'');
  if(l.status==='submitted')return '<div class="row">'+chip('Payment sent. Waiting for admin to confirm')+'</div>';
  return '<div class="row">'+chip('Payment successful','y')+'</div>';
}

/* ============ GOOGLE SIGN-IN ============ */
var gLoaded=false;
function setupGoogle(){
  if(!CONFIG.googleClientId||!$('#gbtn'))return;
  var init=function(){
    try{
      window.google.accounts.id.initialize({client_id:CONFIG.googleClientId,callback:onGoogle});
      window.google.accounts.id.renderButton($('#gbtn'),{theme:'filled_black',size:'large',text:'continue_with',shape:'rectangular'});
    }catch(e){}
  };
  if(window.google&&window.google.accounts){init();return}
  if(gLoaded)return;
  gLoaded=true;
  var s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=init;document.head.appendChild(s);
}
function onGoogle(resp){
  var pl;
  try{
    var b=resp.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    pl=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})));
  }catch(e){toast('Google sign-in failed. Try again.');return}
  var r=parts()[0];
  if(r==='login'){
    var u=usersArr().filter(function(x){return x.email&&x.email===pl.email})[0];
    if(!u){toast('No account uses this Google email. Sign up first.');return}
    setMe(u.code);location.hash='#dashboard';refresh();
  }else{ui.google={email:pl.email,name:pl.name||''};refresh()}
}

/* ============ ACTIONS ============ */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act'),id=Number(b.getAttribute('data-id')),m=me();
  if(a==='copy'){
    var t=b.getAttribute('data-t');
    try{navigator.clipboard.writeText(t).then(function(){toast('Copied')},function(){toast('Press and hold to copy')})}catch(err){toast('Press and hold to copy')}
  }
  else if(a==='logout'){var adm=ui.admin;setMe(null);ui=ui0();ui.admin=adm;location.hash='#market';refresh()}
  else if(a==='promote'){
    if(!m||m.role!=='affiliate'||!isActive(m)){toast('Activate your membership first');return}
    db.picks[m.code]=db.picks[m.code]||[];
    if(db.picks[m.code].indexOf(id)<0)db.picks[m.code].push(id);
    save();toast('Added to your dashboard');refresh();
  }
  else if(a==='unpromote'){db.picks[m.code]=(db.picks[m.code]||[]).filter(function(x){return x!==id});save();refresh()}
  else if(a==='pic'){var pp=db.products[id],i=Number(b.getAttribute('data-i')),im=$('#mainpic');if(pp&&im&&pp.images[i])im.src=pp.images[i]}
  else if(a==='rmimg'){var k=b.getAttribute('data-k');(k==='a'?ui.imgs:ui.eimgs).splice(Number(b.getAttribute('data-i')),1);drawThumbs(k)}
  else if(a==='edit'){var ep=db.products[id];if(!ep||!m||ep.seller!==m.code)return;ui.edit=id;ui.del=null;ui.eimgs=(ep.images||[]).slice();refresh()}
  else if(a==='del'){ui.del=id;ui.edit=null;refresh()}
  else if(a==='paylead'){ui.payLead=id;refresh()}
  else if(a==='confirmsale'||a==='nosale'){
    var sl=leadById(id);
    if(!sl||!m||sl.seller!==m.code||sl.status!=='reached')return;
    if(a==='confirmsale'){
      sl.status='owed';sl.saleAt=Date.now();
      notify(sl.affiliate,'earn','The seller confirmed a sale of "'+sl.productName+'". '+money(sl.commission)+' was added to your commission record. It becomes available to withdraw after the seller pays and admin confirms.',{leadId:sl.id});
      toast('Sale confirmed. Now pay the affiliate.');
    }else{
      sl.status='declined';
      notify(sl.affiliate,'earn','The seller marked the buyer from "'+sl.productName+'" as no sale, so no commission was added.',{leadId:sl.id});
    }
    save();refresh();
  }
  else if(a==='cancel'){ui.edit=ui.del=ui.payLead=null;ui.confirmReset=false;refresh()}
  else if(a==='delyes'){
    var p=db.products[id];
    if(p&&m&&p.seller===m.code){delete db.products[id];Object.keys(db.picks).forEach(function(c){db.picks[c]=db.picks[c].filter(function(x){return x!==id})});save();ui.del=null;toast('Product deleted');refresh()}
  }
  else if(!ui.admin&&(a==='approve'||a==='reject'||a==='lconfirm'||a==='lreject'||a==='wdone'||a==='demo'||a==='reset'||a==='resetyes'))return;
  else if(a==='approve'||a==='reject'){
    var u=db.users[b.getAttribute('data-u')],pid=Number(b.getAttribute('data-p'));
    var pay=u&&(u.payments||[]).filter(function(x){return x.id===pid})[0];
    if(!pay)return;
    if(a==='approve'){
      pay.status='approved';u.paidUntil=Math.max(Date.now(),u.paidUntil||0)+CONFIG.periodDays*DAY;
      notify(u.code,'info','Your membership payment of '+money(CONFIG.fee)+' is confirmed. Your account is active until '+fmt(u.paidUntil)+'.');
    }else{
      pay.status='rejected';
      notify(u.code,'info','Your membership payment (ID '+pay.txn+') could not be confirmed. Check the details and submit it again, or message us on WhatsApp.');
    }
    save();refresh();
  }
  else if(a==='lconfirm'){
    var l=leadById(id);if(!l||l.status!=='submitted')return;
    l.status='paid';l.confirmedAt=Date.now();
    notify(l.seller,'info','Payment successful. Your payment of '+money(l.commission)+' for affiliate '+l.affiliate+' on "'+l.productName+'" is confirmed.');
    notify(l.affiliate,'earn',money(l.commission)+' from "'+l.productName+'" is confirmed. It is now available to withdraw.');
    save();toast('Payment confirmed');refresh();
  }
  else if(a==='lreject'){
    var l2=leadById(id);if(!l2||l2.status!=='submitted')return;
    var tx=l2.payment&&l2.payment.txn;
    l2.status='owed';l2.rejected=true;delete l2.payment;
    notify(l2.seller,'info','Your payment (ID '+tx+') for affiliate '+l2.affiliate+' could not be confirmed. Open the notification for that buyer and submit the payment again.');
    save();refresh();
  }
  else if(a==='wdone'){
    var w=db.withdrawals.filter(function(x){return x.id===id})[0];if(!w||w.status!=='todo')return;
    w.status='done';w.doneAt=Date.now();
    notify(w.affiliate,'info','Payment done. '+money(w.amount)+' was sent to '+w.network+' '+w.number+' ('+w.accName+').');
    save();toast('Marked as paid');refresh();
  }
  else if(a==='demo'){loadDemo();refresh();toast('Demo data added')}
  else if(a==='reset'){ui.confirmReset=true;refresh()}
  else if(a==='resetyes'){db=blank();save();setMe(null);ui=ui0();ui.admin=true;refresh();toast('All data erased')}
  else if(a==='adminout'){ui.admin=false;location.hash='#market';refresh()}
});

function showErr(msg){var el=$('#err');if(el){el.textContent=msg;el.hidden=false}}
function val(id){var el=$('#'+id);return el?el.value.trim():''}
function cleanPhone(s){return String(s).replace(/[\s-]/g,'')}
var PHONE=/^\+?\d{9,15}$/;

document.addEventListener('submit',function(e){
  e.preventDefault();
  var f=e.target,id=f.id,m=me();
  if(id==='reg'){
    var role=f.getAttribute('data-role'),g=ui.google||{};
    var name=val('rn'),dob=val('rd'),phone=cleanPhone(val('rp')),nat=val('rnat'),pw=val('rpw'),pw2=val('rpw2');
    if(name.length<3)return showErr('Enter your full name.');
    if(!dob)return showErr('Enter your date of birth.');
    var max=new Date();max.setFullYear(max.getFullYear()-CONFIG.minAge);
    if(new Date(dob)>max)return showErr('You must be at least '+CONFIG.minAge+' years old to join.');
    if(!PHONE.test(phone))return showErr('Enter a valid phone number.');
    if(!nat)return showErr('Enter your nationality.');
    if(!g.email){if(pw.length<6)return showErr('Choose a password of at least 6 characters.');if(pw!==pw2)return showErr('The two passwords do not match.')}
    if(usersArr().some(function(u){return u.phone===phone}))return showErr('This phone number is already registered. Log in instead.');
    if(g.email&&usersArr().some(function(u){return u.email===g.email}))return showErr('This Google account is already registered. Log in instead.');
    var code=ui.reg[role];if(db.users[code])code=newCode(role);
    db.users[code]={code:code,role:role,name:name,dob:dob,phone:phone,nationality:nat,experience:val('rexp'),about:val('rab'),email:g.email||'',pass:g.email?'':hash(pw),createdAt:Date.now(),paidUntil:0,payments:[]};
    if(role==='affiliate')db.picks[code]=[];
    save();setMe(code);delete ui.reg[role];ui.google=null;toast('Account created. Pay '+money(CONFIG.fee)+' to activate it.');location.hash='#pay';
  }
  else if(id==='login'){
    var c=val('lc').toUpperCase(),pass=$('#lp').value,u=db.users[c]||usersArr().filter(function(x){return x.phone===cleanPhone(val('lc'))})[0];
    if(!u||!u.pass||u.pass!==hash(pass))return showErr('Code, phone number or password is wrong.');
    setMe(u.code);location.hash='#dashboard';refresh();
  }
  else if(id==='pay'){
    var tx=val('ptx').toUpperCase(),from=cleanPhone(val('pfrom'));
    if(tx.length<6)return showErr('Enter the transaction ID from your confirmation message.');
    if(!PHONE.test(from))return showErr('Enter the number you paid from.');
    if(txnUsed(tx))return showErr('This transaction ID has already been submitted.');
    m.payments=m.payments||[];m.payments.push({id:db.seq++,txn:tx,network:val('pnet'),from:from,at:Date.now(),status:'pending'});
    notify('ADMIN','info',m.name+' ('+m.code+') paid the '+money(CONFIG.fee)+' membership fee. Transaction ID '+tx+'. Confirm it in the To do tab.');
    save();toast('Payment sent for checking');refresh();
  }
  else if(id==='addp'||id==='editp'){
    var pre=id==='addp'?'a':'e',nm=val(pre+'n'),ds=val(pre+'d'),pr=parseFloat(val(pre+'p')),rt=parseFloat(val(pre+'r')),lk=val(pre+'l');
    var ct=val(pre+'ct'),cn=cleanPhone(val(pre+'c')),imgs=id==='addp'?ui.imgs:ui.eimgs;
    if(!m||m.role!=='seller')return;
    if(id==='addp'&&!isActive(m))return showErr('Pay your monthly fee before publishing.');
    if(nm.length<3)return showErr('Enter a product name.');
    if(!(pr>0))return showErr('Enter a price above zero.');
    if(!(rt>=1&&rt<=90))return showErr('Commission must be between 1% and 90%.');
    if(!PHONE.test(cn))return showErr('Enter the contact number buyers should use.');
    if(imgs.length<CONFIG.minPictures)return showErr('Add at least '+CONFIG.minPictures+' pictures of the product.');
    if(lk&&!/^https?:\/\/\S+\.\S+/.test(lk))return showErr('Enter the full link, starting with https://');
    if(id==='addp'){
      var nid=db.seq++;
      db.products[nid]={id:nid,seller:m.code,name:nm,desc:ds,price:pr,rate:rt,link:lk,contactType:ct,contact:cn,images:imgs.slice(),createdAt:Date.now(),visitors:{}};
      if(!save()){delete db.products[nid];return}
      ui.imgs=[];toast('Product published');refresh();
    }else{
      var p=db.products[Number(f.getAttribute('data-id'))];if(!p||p.seller!==m.code)return;
      var old={name:p.name,desc:p.desc,price:p.price,rate:p.rate,link:p.link,contactType:p.contactType,contact:p.contact,images:p.images};
      p.name=nm;p.desc=ds;p.price=pr;p.rate=rt;p.link=lk;p.contactType=ct;p.contact=cn;p.images=imgs.slice();
      if(!save()){Object.assign(p,old);return}
      ui.edit=null;ui.eimgs=[];toast('Changes saved');refresh();
    }
  }
  else if(id==='leadpay'){
    var l=leadById(Number(f.getAttribute('data-id')));
    if(!l||!m||l.seller!==m.code||l.status!=='owed')return;
    var ltx=val('ltx').toUpperCase(),lfrom=cleanPhone(val('lfrom'));
    if(ltx.length<6)return showErr('Enter the transaction ID from your confirmation message.');
    if(!PHONE.test(lfrom))return showErr('Enter the number you paid from.');
    if(txnUsed(ltx))return showErr('This transaction ID has already been submitted.');
    l.status='submitted';l.rejected=false;l.payment={txn:ltx,network:val('lnet'),from:lfrom,at:Date.now()};
    notify('ADMIN','info',m.name+' ('+m.code+') paid '+money(l.commission)+' commission for affiliate '+l.affiliate+' on "'+l.productName+'". Transaction ID '+ltx+'. Confirm it in the To do tab.');
    ui.payLead=null;save();toast('Payment sent. Admin will confirm it.');refresh();
  }
  else if(id==='wd'){
    if(!m||m.role!=='affiliate')return;
    var b=bal(m.code),amt=r2(parseFloat(val('wa'))),num=cleanPhone(val('wnum')),an=val('wname'),cc=val('wcode').toUpperCase();
    if(!(amt>0))return showErr('Enter the amount you want to withdraw.');
    if(amt>b.available)return showErr('You can withdraw up to '+money(b.available)+'.');
    if(!PHONE.test(num))return showErr('Enter a valid mobile money number.');
    if(an.length<3)return showErr('Enter the mobile money account name.');
    if(cc!==m.code)return showErr('Type your affiliate code exactly as shown ('+m.code+') to confirm.');
    var w={id:db.seq++,affiliate:m.code,amount:amt,network:val('wnet'),number:num,accName:an,at:Date.now(),status:'todo'};
    db.withdrawals.push(w);
    notify('ADMIN','info','Withdrawal request: pay '+money(amt)+' to '+w.network+' '+num+' ('+an+') for affiliate '+m.code+'.');
    notify(m.code,'info','Your withdrawal request of '+money(amt)+' was received. You will be notified when it is paid.');
    save();toast('Withdrawal requested');refresh();
  }
  else if(id==='adminpin'){
    if($('#pin').value===CONFIG.adminPin){ui.admin=true;refresh()}else showErr('Wrong PIN.');
  }
});
