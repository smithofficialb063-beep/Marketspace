<style>

.wrap{max-width:960px;margin:0 auto}.note{font-size:13px;color:var(--mu)}.num{font-variant-numeric:tabular-nums}

header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:16px;border-bottom:1px solid var(--line)}

.btn.g{background:none;color:var(--fg);border-color:var(--line)}.btn.d{color:var(--bad)}.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}.btn[disabled]{opacity:.5}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.bt{justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:700px){ .grid{grid-template-columns:repeat(4,1fr)} }
.card,.panel{background:var(--s);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel{display:grid;gap:14px}
.card{background:#0a0a0a;border:1.5px solid #FFD400;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.card .btn{margin-top:auto;align-self:stretch;background:#fff;color:#000;border-color:#fff;font-weight:800}
.price{font:700 22px var(--fd)}.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line);color:var(--mu)}.chip.y{background:var(--y);color:var(--on);border-color:var(--y)}
.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--mu)}
.thumb{width:100%;height:140px;object-fit:cover;border-radius:8px;background:#111;display:grid;place-items:center;color:var(--y);font:44px var(--fd)}
.main{width:100%;aspect-ratio:4/3;object-fit:contain;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.strip,.pics{display:flex;flex-wrap:wrap;gap:8px}.strip img{width:64px;height:64px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid var(--line)}
.pic{position:relative;width:84px;height:84px}.pic img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.pic button{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:0;background:var(--y);font-weight:700;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:42px;width:100%}
textarea{min-height:84px}label{display:grid;gap:6px;font-weight:500;font-size:14px}form{display:grid;gap:14px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.err{color:var(--bad);font-size:14px}
.code{background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:700 20px var(--fd);color:var(--y)}
.pg{padding-block:26px;display:grid;gap:16px}.contact{border:1px solid var(--y);border-radius:12px;padding:14px;background:var(--s2);display:grid;gap:10px}
.item{display:grid;gap:10px;background:var(--s);border:1px solid var(--line);border-radius:12px;padding:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0));background:var(--y);color:var(--on);font-weight:600;padding:10px 16px;border-radius:8px;z-index:30}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.badge{background:var(--y);color:var(--on);border-radius:99px;padding:0 6px;font-size:12px;font-weight:700}.lk{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mu);font-weight:500;font-size:12px}
.tabs{display:flex;gap:8px}.tabs .btn{flex:1}
[hidden]{display:none!important}footer{border-top:1px solid var(--line);margin-top:40px;padding-top:20px;text-align:center}
</style>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,collection,getDocs,query,orderBy,writeBatch,where,arrayUnion,arrayRemove} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyBKUWZP1-LgvmlDVJRhK1FWMZP94I02mt0",authDomain:"marketspace-24299.firebaseapp.com",projectId:"marketspace-24299",storageBucket:"marketspace-24299.firebasestorage.app",messagingSenderId:"420321552467",appId:"1:420321552467:web:cb87aa9c91c4c5822cfea6"});
const auth=getAuth(app),db=getFirestore(app);
const CFG={fee:5,minAge:18,minPics:2,maxPics:5,period:30*864e5,momo:['0257218681','Eric Annor Gyau'],cmomo:['0257411489','Eric Annor Gyau'],admin:'smithofficialb063@gmail.com'};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'GH₵ '+Number(n).toLocaleString('en-GH',{minimumFractionDigits:2,maximumFractionDigits:2});
const AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const rnd=n=>[...crypto.getRandomValues(new Uint32Array(n))].map(x=>AL[x%AL.length]).join('');
const cp=s=>String(s).replace(/[\s-]/g,'');
const PHONE=/^\+?\d{9,15}$/;
const intl=n=>{const d=String(n).replace(/\D/g,'');return d[0]==='0'?'233'+d.slice(1):d};
const val=id=>($('#'+id)?.value||'').trim();
const err=m=>{const e=$('#err');if(e){e.textContent=m;e.hidden=false}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200)};
const note=(t,b,btn='')=>`<div class="pg"><div class="panel narrow"><h2>${esc(t)}</h2><p class="note">${esc(b)}</p>${btn}</div></div>`;

let me=null,P=[],ready=false,busy=false;
const ui={imgs:[],edit:null,q:'',codes:{},pay:null,badge:0,tab:'home',cur:null};
const r2=n=>Math.round(n*100)/100;
const fmt=t=>new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const active=u=>!!u&&u.paidUntil>Date.now();
const isAdmin=()=>auth.currentUser?.email===CFG.admin;
const vid=()=>{try{let v=localStorage.getItem('ms_vid');if(!v){v=rnd(14);localStorage.setItem('ms_vid',v)}return v}catch(e){return rnd(14)}};
const col=(n,...c)=>getDocs(query(collection(db,n),...c)).then(s=>s.docs.map(d=>({id:d.id,...d.data()})));
async function refreshMe(){const u=auth.currentUser;if(!u)return;const s=await getDoc(doc(db,'users',u.uid));if(s.exists())me={...s.data(),uid:u.uid}}
let PR={};
const live=p=>PR[p.sellerCode]?.paidUntil>Date.now();
const NET=['MTN MoMo','Telecel Cash','AirtelTigo Money','Other'].map(x=>`<option>${x}</option>`).join('');
const LBL={reached:'Link opened - waiting for buyer', 'buyer-confirmed':'BUYER SAYS THEY BOUGHT - Confirm now!', declined:'No sale',owed:'Waiting for you to pay',submitted:'Payment being confirmed',paid:'Paid and confirmed'};
const ALBL={reached:'Waiting for buyer to buy', 'buyer-confirmed':'Buyer confirmed - waiting for seller', declined:'No sale',owed:'Waiting for seller to pay',submitted:'Seller payment being confirmed',paid:'Confirmed'};
const counted=l=>['owed','submitted','paid'].includes(l.status);
const bal=(L,W)=>{let e=0,pe=0,cf=0,o=0,dn=0;L.forEach(l=>{if(counted(l)){e+=l.commission;l.status==='paid'?cf+=l.commission:pe+=l.commission}});W.forEach(w=>{o+=w.amount;if(w.status==='done')dn+=w.amount});return{earned:r2(e),pending:r2(pe),available:r2(cf-o),paidOut:r2(dn)}};
const linkRow=t=>`<div class="row"><code class="lk">${esc(t)}</code><button class="btn sm" data-act="copy" data-t="${esc(t)}">Copy</button></div>`;
const momoBox=(m,amt)=>`<div class="contact"><p class="note">Send ${amt} to this mobile money number</p><strong class="num" style="font-size:26px;color:var(--y)">${m[0]}</strong><p>Account name: <b>${esc(m[1])}</b></p><div><button type="button" class="btn sm" data-act="copy" data-t="${m[0]}">Copy number</button></div></div>`;
const T=(t,cols,rows,empty)=>`<h3 style="margin-top:12px">${t}</h3><div class="panel tw"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${cols.length}" class="note">${empty}</td></tr>`}</tbody></table></div>`;
function subCard(u){const on=active(u),d=Math.ceil((u.paidUntil-Date.now())/864e5);return `<div class="item row bt"><div><div class="row"><h3>Membership</h3><span class="chip ${on?'y':''}">${on?'Active':'Not active'}</span></div><p class="note">${on?`${d} day${d===1?'':'s'} left. Paid until ${fmt(u.paidUntil)}.`:`Pay ${money(CFG.fee)} to ${u.role==='seller'?'list':'promote'} products.`}</p></div><a class="btn sm" href="#pay">${on?'Renew early':'Pay '+money(CFG.fee)}</a></div>`}

/* ---------- downloads + notifications ---------- */
const dl=(s,n)=>{const a=document.createElement('a');a.href=s;a.download=n;document.body.appendChild(a);a.click();a.remove()};
const imgsOf=id=>ui.cur?.id===id?ui.cur.images:(P.find(p=>p.id===id)?.images||[]);
const dlBox=(id,im)=>im.length?`<div class="contact"><h3>Ad pictures</h3><p class="note">Save these pictures and use them in your adverts.</p><div class="pics">${im.map((x,i)=>`<div style="display:grid;gap:6px"><img src="${x}" alt="" style="width:84px;height:84px;object-fit:cover;border-radius:8px"><button class="btn sm" data-act="dlpic" data-id="${id}" data-i="${i}">Save</button></div>`).join('')}</div><div><button class="btn sm" data-act="dlall" data-id="${id}">Download all</button></div></div>`:'';
const seenKey=()=>'ms_seen_'+me.uid;
const getSeen=()=>{try{return +localStorage.getItem(seenKey())||0}catch(e){return 0}};
const tabsBar=n=>`<div class="tabs"><button class="btn${ui.tab==='notes'?' g':''}" data-act="tab" data-id="home">Overview</button><button class="btn${ui.tab==='notes'?'':' g'}" data-act="tab" data-id="notes">Notifications${n?` <span class="badge" style="margin-left:6px">${n}</span>`:''}</button></div>`;
async function getNotes(){
  const sel=me.role==='seller',N=[],add=(at,t)=>{if(at)N.push({at,t})};
  (await col('leads',where(sel?'sellerUid':'affUid','==',me.uid))).forEach(l=>{const n=`"${l.productName}"`;
    if(sel){
      add(l.at,`A buyer opened ${n} through affiliate ${l.affCode}.`);
      add(l.buyerConfirmedAt,`A buyer says they bought ${n}. Confirm the sale now.`);
      add(l.saleAt,`You confirmed a sale of ${n}. Pay affiliate ${l.affCode} ${money(l.commission)}.`);
      add(l.confirmedAt,`Your ${money(l.commission)} payment for ${n} was confirmed.`);
    }else{
      add(l.at,`A buyer opened ${n} through your link.`);
      add(l.buyerConfirmedAt,`A buyer says they bought ${n}. Waiting for the seller to confirm.`);
      add(l.saleAt,`The seller confirmed your sale of ${n}. You earn ${money(l.commission)}.`);
      add(l.confirmedAt,`${money(l.commission)} for ${n} is confirmed and ready to withdraw.`);
    }});
  if(!sel)(await col('withdrawals',where('affUid','==',me.uid))).forEach(w=>{add(w.at,`You requested a withdrawal of ${money(w.amount)}.`);add(w.doneAt,`Your withdrawal of ${money(w.amount)} was paid to ${w.number}.`)});
  if(me.paidUntil){const d=Math.ceil((me.paidUntil-Date.now())/864e5);
    if(d<=0)add(me.paidUntil,'Your membership has expired. Renew to continue.');
    else if(d<=5)add(me.paidUntil-5*864e5,`Your membership ends in ${d} day${d===1?'':'s'}.`)}
  return N.sort((a,b)=>b.at-a.at);
}

onAuthStateChanged(auth,async u=>{
  if(busy)return;
  me=null;
  if(u){try{const s=await getDoc(doc(db,'users',u.uid));if(s.exists())me={...s.data(),uid:u.uid}}catch(e){}}
  ready=true;route();
});

async function loadP(){
  P=await col('products',orderBy('createdAt','desc'));PR={};
  (await col('profiles')).forEach(x=>PR[x.code]=x);
}
const perSale=p=>Math.round(p.price*p.rate)/100;
const thumb=p=>p.images?.[0]?`<img class="thumb" src="${p.images[0]}" alt="${esc(p.name)}">`:`<div class="thumb">${esc((p.name||'?')[0].toUpperCase())}</div>`;
const card=p=>`<article class="card"><a href="#product/${p.id}">${thumb(p)}</a><div style="display:flex;align-items:flex-end;justify-content:space-between;gap:6px"><div><h3 style="font-size:13px;line-height:1.2;text-transform:lowercase">${esc(p.name)}</h3><div class="price num" style="font-size:15px;margin-top:2px">${money(p.price)}</div></div><span style="background:#FFD400;color:#000;font-size:11px;font-weight:900;padding:7px 8px;border-radius:7px;white-space:nowrap">Earn ${money(perSale(p))}</span></div><a class="btn sm" href="#product/${p.id}">View product</a></article>`;
const gridHtml=()=>{const q=ui.q.toLowerCase().trim(),l=P.filter(p=>live(p)&&(!q||(p.name+' '+(p.desc||'')).toLowerCase().includes(q)));return l.length?l.map(card).join(''):`<div class="empty">${q?'No products match your search.':'No products yet.'}</div>`};

/* ---------- views ---------- */
async function vMarket(){
  await loadP();
  return `<section class="pg" style="text-align:center"><h1 style="font-size:32px"><span style="color:#FFD400">No Product? No Problem.</span><br>Promote & Earn.</h1><p class="note" style="max-width:56ch;margin:10px auto 0">Pick a product, share your link, earn commission on every sale.</p>
  <div class="row">${me?'<a class="btn" href="#dashboard">Open my dashboard</a>':'<a class="btn" href="#register">Sign up</a><a class="btn g" href="#login">Log in</a>'}</div></section>
  <div class="row bt" style="margin-bottom:14px"><h2>Products to promote</h2><input id="q" type="search" style="max-width:280px" placeholder="Search products" value="${esc(ui.q)}"></div><div class="grid" id="grid">${gridHtml()}</div>`;
}

async function vProduct(id,ref){
  const s=await getDoc(doc(db,'products',id));
  if(!s.exists())return note('Product not found','This product was removed or the link is wrong.','<a class="btn" href="#market">Back to marketplace</a>');
  const p={id,...s.data()},im=p.images||[],t=p.contactType||'whatsapp',own=me?.uid===p.sellerUid;
  const sp=(await getDoc(doc(db,'profiles',p.sellerCode))).data();
  if(!own&&!isAdmin()&&!(sp?.paidUntil>Date.now()))return note('Product not available','The seller is not active right now.','<a class="btn" href="#market">Back to marketplace</a>');
  if(ref && ref !== me?.code){
    try{
      const ap=(await getDoc(doc(db,'profiles',ref))).data();
      if(ap?.role==='affiliate' && ap.paidUntil>Date.now()){
        const leadId = `${vid()}_${id}_${ref}`;
        const exists = await getDoc(doc(db,'leads',leadId));
        if(!exists.exists()){
          await setDoc(doc(db,'leads',leadId),{productId:id,productName:p.name,sellerUid:p.sellerUid,sellerCode:p.sellerCode,affUid:ap.uid,affCode:ref,commission:perSale(p),at:Date.now(),status:'reached',buyerName: me?.name || 'Guest buyer', buyerPhone: me?.phone || ''});
        }
      }
    }catch(e){}
  }
  ui.cur={id,images:im};const dlb=me?.role==='affiliate'&&active(me)?dlBox(id,im):'';
  const msg=`Hello, I saw "${p.name}" on Marketspace and I am interested.${ref?` (Referred by ${ref})`:''}`;
  const see=!me||own||isAdmin();
  const contact=!see?'<p class="note">Contact details are shown to buyers only.</p>':p.contact?`<div class="contact"><h3>Contact seller to buy product</h3><strong class="num">${esc(p.contact)}</strong><div class="row">${t!=='call'?`<a class="btn" href="https://wa.me/${intl(p.contact)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Chat on WhatsApp</a>`:''}${t!=='whatsapp'?`<a class="btn g" href="tel:+${intl(p.contact)}">Call the seller</a>`:''}</div></div>`:'';
  let buyerConfirm='';
  if(ref && !own){
    buyerConfirm=`<div class="contact" style="border-color:var(--y)"><h3>Did you buy this product?</h3><p class="note">Tap below AFTER you pay the seller on WhatsApp. The seller will then confirm it in their dashboard.</p><button class="btn" data-act="buyer-bought" data-id="${id}" data-ref="${esc(ref)}">✅ Yes, I Bought It</button></div>`;
  }
  let act='';
  if(me?.role==='affiliate'){
    const lk=location.href.split('#')[0]+'#product/'+id+'/'+me.code;
    act=!active(me)?`<p class="note">Your membership is not active, so you cannot promote products.</p><a class="btn" style="justify-self:start" href="#pay">Pay ${money(CFG.fee)}</a>`:(me.picks||[]).includes(id)?`<p class="note">You are promoting this product. Your personal link:</p>${linkRow(lk)}`:`<button class="btn" style="justify-self:start" data-act="promote" data-id="${id}">Promote this product</button>`;
  }else if(!me&&!ref)act=`<p class="note">Want to earn ${money(perSale(p))} for every sale you bring?</p><a class="btn" style="justify-self:start" href="#register/affiliate">Join as affiliate</a>`;
  else if(own)act='<a class="btn" style="justify-self:start" href="#dashboard">Manage in dashboard</a>';
  return `<div class="pg"><a class="note" href="#market">&larr; All products</a><div class="panel">
  ${im.length?`<img class="main" id="mainpic" src="${im[0]}" alt="${esc(p.name)}">${im.length>1?`<div class="strip">${im.map(x=>`<img src="${x}" data-act="pic" alt="">`).join('')}</div>`:''}`:''}
  <div><span class="chip y">${p.rate}% commission</span></div><h1>${esc(p.name)}</h1><div class="price num">${money(p.price)}</div>
  <p style="white-space:pre-wrap">${esc(p.desc||'')}</p><p class="note">Sold by <b>${esc(p.sellerName)}</b> (${esc(p.sellerCode)})</p>${contact}${buyerConfirm}${act}${dlb}</div></div>`;
}

const roleChoice=()=>`<div class="pg"><div class="panel narrow"><h2>How will you use Marketspace?</h2><p class="note">Choose one. You can only hold one type of account.</p>
<a class="btn" href="#register/seller">I am a seller</a><a class="btn g" href="#register/affiliate">I am an affiliate marketer</a></div></div>`;

function vReg(role){
  if(role!=='seller'&&role!=='affiliate')return roleChoice();
  if(me)return note('You already have an account',`Signed in as ${me.name} (${me.code}).`,'<a class="btn" href="#dashboard">Go to dashboard</a>');
  const seller=role==='seller';
  ui.codes[role]=ui.codes[role]||(seller?'SEL-':'AF-')+rnd(6);
  const d=new Date();d.setFullYear(d.getFullYear()-CFG.minAge);
  return `<div class="pg"><div class="panel narrow"><div class="row bt"><h2>Create your ${role} account</h2><a class="note" href="#register">Switch</a></div>
  <p class="note">After signing up you pay ${money(CFG.fee)} a month to activate your account.</p>
  <form id="reg" data-role="${role}" novalidate><div><small class="note">Your ${role} code (username)</small><div class="code">${ui.codes[role]}</div></div>
  <label>Full name<input id="rn" autocomplete="name"></label>

async function more(a,b,id){
  const run=async(fn,m)=>{try{await fn();if(m)toast(m)}catch(x){toast(x.code==='permission-denied'?'Not allowed.':'Something went wrong.')}route(true);return true};
  const up=(c,i,d)=>updateDoc(doc(db,c,i),d);
  if(a==='tab'){ui.tab=id;route(true);return true}
  if(a==='dlpic'){dl(imgsOf(id)[+b.dataset.i],`marketspace-${id.slice(0,6)}-${+b.dataset.i+1}.jpg`);return true}
  if(a==='dlall'){imgsOf(id).forEach((s,i)=>setTimeout(()=>dl(s,`marketspace-${id.slice(0,6)}-${i+1}.jpg`),i*400));toast('Downloading pictures');return true}
  if(a==='copy'){try{await navigator.clipboard.writeText(b.dataset.t);toast('Copied')}catch(x){toast('Press and hold to copy')}return true}
  if(a==='promote')return run(async()=>{await up('users',me.uid,{picks:arrayUnion(id)});me.picks=[...(me.picks||[]),id]},'Added to your dashboard');
  if(a==='unpromote')return run(async()=>{await up('users',me.uid,{picks:arrayRemove(id)});me.picks=(me.picks||[]).filter(x=>x!==id)});
  if(a==='buyer-bought')return run(async()=>{
    const leads = await col('leads', where('productId','==',id), where('affCode','==',b.dataset.ref));
    const target = leads.filter(l=>l.status==='reached').sort((x,y)=>y.at-x.at)[0];
    if(!target) throw new Error('No lead found');
    await up('leads', target.id, {status:'buyer-confirmed', buyerConfirmedAt: Date.now()});
    const pDoc = await getDoc(doc(db,'products',id));
    const p = pDoc.exists() ? pDoc.data() : null;
    if(p?.contact) window.open(`https://wa.me/${intl(p.contact)}?text=${encodeURIComponent(`Hi, I bought "${p.name}" via Marketspace (Affiliate ${b.dataset.ref}). Please confirm my sale in your dashboard.`)}`, '_blank');
  }, 'Thanks! Seller has been notified on WhatsApp. They must now tap Confirm Sale.');
  if(a==='sale')return run(()=>up('leads',id,{status:'owed',saleAt:Date.now()}),'Sale confirmed. Now pay the affiliate.');
  if(a==='nosale')return run(()=>up('leads',id,{status:'declined'}));
  if(a==='payl'){ui.pay=id;route(true);return true}
  if(a==='approve')return run(async()=>{const p=(await getDoc(doc(db,'payments',id))).data(),us=(await getDoc(doc(db,'users',p.uid))).data(),pu=Math.max(Date.now(),us.paidUntil||0)+CFG.period,w=writeBatch(db);w.update(doc(db,'payments',id),{status:'approved'});w.update(doc(db,'users',p.uid),{paidUntil:pu});w.update(doc(db,'profiles',p.code),{paidUntil:pu});await w.commit()},'Approved');
  if(a==='reject')return run(()=>deleteDoc(doc(db,'payments',id)),'Rejected. The member can submit again.');
  if(a==='lconfirm')return run(()=>up('leads',id,{status:'paid',confirmedAt:Date.now()}),'Payment confirmed');
  if(a==='lreject')return run(()=>up('leads',id,{status:'owed',rejected:true}),'Sent back to the seller');
  if(a==='wdone')return run(()=>up('withdrawals',id,{status:'done',doneAt:Date.now()}),'Marked as paid');
  return false;
}

  toast('Withdrawal requested');route(true);
}

/* ---------- pictures ---------- */
function readImages(files,done){
  const arr=[...files].filter(f=>f.type.startsWith('image/')).slice(0,Math.max(0,CFG.maxPics-ui.imgs.length));
  if(!arr.length)return done();
  let left=arr.length;const fin=()=>{if(!--left)done()};
  arr.forEach(f=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{
    const sc=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*sc)||1;c.height=Math.round(im.height*sc)||1;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    ui.imgs.push(c.toDataURL('image/jpeg',0.65));fin()};im.onerror=fin;im.src=fr.result};fr.onerror=fin;fr.readAsDataURL(f)});
}

  else if(a==='pic')$('#mainpic').src=b.src;
  else if(a==='rmimg'){ui.imgs.splice(+b.dataset.i,1);$('#thumbs').innerHTML=thumbsHtml()}
  else if(a==='edit'){ui.edit=id;ui.imgs=[...(P.find(p=>p.id===id)?.images||[])];route()}
  else if(a==='cancel'){ui.edit=null;ui.pay=null;ui.imgs=[];route(true)}
  else if(a==='del'&&confirm('Delete this product? This cannot be undone.')){
    try{await deleteDoc(doc(db,'products',id));toast('Product deleted')}catch(x){toast('Could not delete.')}
    route(true);

});

  try{
    if(f.id==='reg')await doReg(f.dataset.role);
    else if(f.id==='login')await doLogin();
    else if(f.id==='pf')await doProduct(f.dataset.id);
    else if(f.id==='pay')await doPay();
    else if(f.id==='lpay')await doLeadPay(f.dataset.id);
    else if(f.id==='wd')await doWd();
  }catch(x){err(x.code==='permission-denied'?'Permission denied. Check your Firestore rules.':x.message)}
  if(btn)btn.disabled=false;
});

async function doReg(role){
  const name=val('rn'),dob=val('rd'),phone=cp(val('rp')),email=val('re').toLowerCase(),nat=val('rnat'),pw=$('#rpw').value,pw2=$('#rpw2').value,code=ui.codes[role];
  const max=new Date();max.setFullYear(max.getFullYear()-CFG.minAge);
  if(name.length<3)return err('Enter your full name.');
  if(!dob)return err('Enter your date of birth.');
  if(new Date(dob)>max)return err(`You must be at least ${CFG.minAge} years old to join.`);
  if(!PHONE.test(phone))return err('Enter a valid phone number.');
  if(!/^\S+@\S+\.\S+$/.test(email))return err('Enter a valid email.');
  if(!nat)return err('Enter your nationality.');
  if(pw.length<6)return err('Choose a password of at least 6 characters.');
  if(pw!==pw2)return err('The two passwords do not match.');
  const pid='p'+phone.replace(/\D/g,'');
  if((await getDoc(doc(db,'codes',pid))).exists())return err('This phone number is already registered. Log in instead.');
  busy=true;
  try{
    const cr=await createUserWithEmailAndPassword(auth,email,pw),uid=cr.user.uid;
    const u={code,role,name,dob,phone,email,nationality:nat,experience:val('rexp'),createdAt:Date.now(),paidUntil:0};
    const w=writeBatch(db);
    w.set(doc(db,'users',uid),u);
    w.set(doc(db,'profiles',code),{uid,code,role,name,experience:u.experience,createdAt:u.createdAt,paidUntil:0});
    w.set(doc(db,'codes',code),{email});
    w.set(doc(db,'codes',pid),{email});
    try{await w.commit()}catch(x){await cr.user.delete().catch(()=>{});throw x}
    me={...u,uid};delete ui.codes[role];
    toast('Account created. Pay your first month to activate it.');location.hash='#pay';
  }catch(x){
    if(x.code==='auth/email-already-in-use')return err('This email is already registered. Log in instead.');
    throw x;
  }finally{busy=false}
  route();
}

async function doLogin(){
  const raw=val('lc'),pw=$('#lp').value;let email;
  if(!raw||!pw)return err('Enter your code, phone number or email and your password.');
  if(raw.includes('@'))email=raw.toLowerCase();
  else{
    const key=/^[A-Za-z]+-/.test(raw)?raw.toUpperCase():'p'+cp(raw).replace(/\D/g,'');
    const s=await getDoc(doc(db,'codes',key));
    if(!s.exists())return err('Code, phone number or password is wrong.');
    email=s.data().email;
  }
  try{await signInWithEmailAndPassword(auth,email,pw)}catch(x){return err('Code, phone number or password is wrong.')}
  location.hash='#dashboard';
}

async function doProduct(id){
  const name=val('pn'),price=parseFloat(val('pp')),rate=parseFloat(val('pr')),contact=cp(val('pc'));
  if(!me||me.role!=='seller')return;
  if(!id&&!active(me))return err('Pay your monthly fee before publishing.');
  if(name.length<3)return err('Enter a product name.');
  if(!(price>0))return err('Enter a price above zero.');
  if(!(rate>=1&&rate<=90))return err('Commission must be between 1% and 90%.');
  if(!PHONE.test(contact))return err('Enter the contact number buyers should use.');
  if(ui.imgs.length<CFG.minPics)return err(`Add at least ${CFG.minPics} pictures of the product.`);
  const d={name,desc:val('pd'),price,rate,contactType:val('pt'),contact,images:[...ui.imgs]};
  if(id){await updateDoc(doc(db,'products',id),d);toast('Changes saved')}
  else{await addDoc(collection(db,'products'),{...d,sellerUid:me.uid,sellerCode:me.code,sellerName:me.name,createdAt:Date.now()});toast('Product published')}
  ui.edit=null;ui.imgs=[];route(true);
}
</script>
